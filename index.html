<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Jogo Ainda Sem Nome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css?v=18">
</head>
<body>
  <main>
    <!-- Inimigo (topo) -->
    <section id="enemy-area" class="enemy-area">
      <div class="enemy-head">
        <span id="enemy-name" class="enemy-name"></span>
        <span id="enemy-intent" class="intent"></span>
      </div>
      <div class="bar enemy-bar"><div id="enemy-hp-fill" class="fill"></div><span id="enemy-hp-text"></span></div>
      <!-- Cena em pixel art (palco ampliado sem borrar; ver src/scene.js) -->
      <div id="scene" class="scene">
        <div id="stage" class="stage">
          <canvas id="scene-bg" class="px"></canvas>
          <div id="enemy-wrap" class="enemy-wrap">
            <canvas id="enemy-sprite" class="px enemy-sprite"></canvas>
          </div>
          <!-- Você: Apostador Amaldiçoado, de costas na diagonal -->
          <img id="hero" class="px hero" src="assets/hero/apostador_costas.png" alt="">
        </div>
      </div>
    </section>

    <!-- Dados (meio) -->
    <div id="tray" class="tray"></div>

    <!-- Jogador (embaixo) -->
    <section class="player-area">
      <p id="log" class="log"></p>
      <div class="combo-line">
        <span id="combo"></span>
        <span id="damage" class="damage"></span>
      </div>
      <div id="player-hp" class="player-hp">
        <span class="label">Vida</span>
        <div class="bar player-bar"><div id="player-hp-fill" class="fill"></div><span id="player-hp-text"></span></div>
        <span id="reserve" class="reserve" title="Reserva de defesa"></span>
      </div>
      <div id="turn-buttons" class="buttons">
        <button id="roll">Rolar <small id="rolls"></small></button>
        <button id="attack" class="attack">Atacar</button>
      </div>
      <div id="defense-buttons" class="buttons" hidden>
        <button id="defend" class="defend">Defender</button>
        <button id="endure" class="endure">Aguentar</button>
      </div>
    </section>
  </main>

  <div id="hurt" class="hurt"></div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-box">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="overlay-btn"></button>
    </div>
  </div>

  <script src="src/dice.js?v=18"></script>
  <script src="src/scene.js?v=18"></script>
  <script src="src/combat.js?v=18"></script>
</body>
</html>
